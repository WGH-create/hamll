# ============================================================
# 开发环境变量模板（application-dev.yaml）
#
# 使用方式：将本文件复制到需要启动的微服务模块的
#   src/main/resources/ 目录下，并重命名为 application-dev.yaml
# 例如：
#   item-service/src/main/resources/application-dev.yaml
#   cart-service/src/main/resources/application-dev.yaml
#   user-service/src/main/resources/application-dev.yaml
#   trade-service/src/main/resources/application-dev.yaml
#   pay-service/src/main/resources/application-dev.yaml
#   hm-service/src/main/resources/application-dev.yaml
#
# 说明：真实的 application-dev.yaml 已被 .gitignore 忽略，请勿提交。
# ============================================================
hm:
  db:
    host: mysql        # 数据库地址：容器内互联用服务名 mysql；本机调试改为 127.0.0.1
    pw: 123            # 数据库密码，请修改为你自己的密码
